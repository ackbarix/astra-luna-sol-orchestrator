name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install-harness-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile install.py config_overlay.py scripts/token_usage.py scripts/check-runtime.py scripts/harness.py als_harness/*.py
      - name: Check each shell script (not just the first positional argument)
        run: |
          for script in install.sh setup.sh scripts/*.sh; do
            bash -n "$script"
          done
