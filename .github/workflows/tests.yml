name: Tests
on:
  push:
  pull_request:
jobs:
  install-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile install.py config_overlay.py scripts/token_usage.py
      - run: bash -n scripts/run.sh scripts/usage.sh scripts/check-runtime.sh
