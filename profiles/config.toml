# Astra Luna Sol project profile installed only when no project Codex config exists.
# For existing projects, install.py safely merges these model defaults into
# existing .codex/config.toml and can restore the original assignments.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
