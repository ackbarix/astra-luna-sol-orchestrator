# Astra–Luna–Sol model defaults. Project mode merges these keys reversibly into
# .codex/config.toml; global mode installs this file as $CODEX_HOME/als.config.toml
# (opt in with `codex --profile als`). Role pins live in agents/*.toml.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
